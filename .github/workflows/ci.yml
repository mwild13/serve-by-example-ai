name: CI

# Runs the same checks a handoff lists under "Checks run": lint, CSS token
# lint, typecheck, unit tests and the unused-code scan. Needs no secrets and never deploys;
# Cloudflare Pages builds and deploys separately.
#
# `main` is protected and requires the `checks` job. Releases are a direct push
# of a preview branch to `main`, so the job has to run on preview branches too:
# GitHub only accepts the push once that same commit has passed here.
on:
  pull_request:
  push:
    branches: [main, "preview/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm test
      - run: npm run knip
